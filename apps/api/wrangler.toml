name = "liftwise-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "liftwise"
migrations_dir = "migrations"

# The PWA (the apps/web build) comes from the same origin as the API (§6.1); the Worker runs
# first only for its own routes, every other unknown path gets the app shell.
[assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]
